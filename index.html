<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #86d2c9;outline-offset:1px}button:disabled{opacity:.47;cursor:not-allowed}h1,h2,h3,p{margin-top:0}.shell{display:flex;min-height:100vh}.sidebar{background:var(--navy);color:#dbe8f0;width:248px;flex:none;padding:26px 15px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:12px;padding:0 12px;color:#fff;font-weight:850;font-size:21px;letter-spacing:-.6px}.brandmark{width:37px;height:37px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-size:22px;color:white}.brand small{display:block;font-size:10px;color:#a6b7c9;letter-spacing:1.25px;text-transform:uppercase;font-weight:700}.nav{display:grid;gap:5px}.nav button{border:none;color:#b7c9dc;background:transparent;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;width:100%;border-radius:9px;font-weight:650}.nav button.active,.nav button:hover{background:#23354d;color:#fff}.nav .ni{font-size:18px;width:23px;text-align:center}.sidebar-foot{margin-top:auto;border-top:1px solid #324056;padding:17px 10px 0;font-size:12px;color:#b2c1d3}.sidebar-foot strong{color:white}.main{flex:1;min-width:0}.topbar{background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:17px clamp(22px,4vw,55px);gap:14px}.topbar strong{font-size:14px}.topbar small{color:var(--muted);display:block}.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;gap:6px;background:#eaf1f7;color:#3d5874;font-weight:700;font-size:11px;letter-spacing:.25px;border-radius:100px;padding:6px 10px}.content{max-width:1390px;margin:auto;padding:clamp(22px,4vw,50px)}.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px;flex-wrap:wrap}.page-title h1{font-size:28px;line-height:1.23;margin:0 0 8px;letter-spacing:-.65px}.page-title p{margin:0;color:var(--muted)}.btn{background:white;border:1px solid #d8e0e8;color:#23324a;border-radius:9px;padding:10px 14px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}.btn:hover{background:#f7f9fb}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#007b73}.btn.dark{background:#172a42;color:white;border-color:#172a42}.btn.danger{color:var(--red);border-color:#f0c6cb}.btn.small{padding:6px 10px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}.btn-group{display:flex;flex-wrap:wrap;gap:9px}.grid-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}.kpi .k-icon{font-size:20px;display:block;margin-bottom:14px}.kpi small{display:block;color:var(--muted);font-weight:600}.kpi strong{font-size:31px;display:block;letter-spacing:-.8px;margin-top:3px}.kpi .detail{font-size:11px;color:var(--muted);margin-top:5px}.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}.panel-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel-head h2{font-size:17px;margin:0;letter-spacing:-.25px}.panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.panel-body{padding:22px}.empty{padding:50px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;font-size:17px;color:var(--ink);margin:10px 0 5px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#718097;background:#f8fafc;padding:12px 17px;white-space:nowrap}.table td{border-top:1px solid #edf1f5;padding:13px 17px;vertical-align:middle}.table tbody tr:hover{background:#fbfcfd}.table .name{font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:2px}.status{display:inline-block;border-radius:30px;padding:5px 10px;font-weight:750;font-size:11px;white-space:nowrap}.status.open{background:var(--light-amber);color:#8b5c00}.status.complete{background:var(--light-teal);color:#006d64}.status.draft{background:#eaf0f7;color:#53657d}.progress{width:92px;background:#e7edf1;height:7px;border-radius:40px;overflow:hidden}.progress i{height:100%;background:var(--teal);display:block;border-radius:40px}.progress-label{display:block;color:#7a8699;font-size:11px;margin-top:4px}.label{display:block;color:#44546a;font-size:12px;font-weight:750;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #d8e2e9;background:#fff;border-radius:9px;padding:10px 12px;min-height:42px;color:#1d2b3d}.textarea{min-height:95px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field{min-width:0}.field.span2{grid-column:span 2}.field.span3{grid-column:span 3}.muted{color:var(--muted)}.helper{font-size:11px;color:var(--muted);margin-top:6px}.notice{background:#f0f9f7;border:1px solid #cce9e2;padding:13px 16px;border-radius:10px;font-size:12px;color:#28625f;margin-bottom:22px}.notice.warn{background:var(--light-amber);border-color:#f8e7b5;color:#7f5a00}.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:18px;align-items:start}.issue{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf1f5}.issue:last-child{border-bottom:none}.issue input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);margin-top:2px}.issue-text{flex:1;overflow-wrap:anywhere}.issue-text.done{color:#778797;text-decoration:line-through}.issue-input{display:flex;gap:9px;margin-top:14px}.line-entry{display:grid;grid-template-columns:minmax(130px,2fr) 74px 110px auto;gap:8px;margin-bottom:16px}.line-entry.parts{grid-template-columns:minmax(150px,2fr) 74px auto}.lineinput{width:100%;max-width:100px;background:white;border:1px solid #d8e2e9;border-radius:8px;padding:7px 8px;min-width:65px}.mini-table{width:100%;border-collapse:collapse}.mini-table th{text-align:left;color:#758196;font-size:11px;font-weight:750;padding:7px 8px;background:#f8fafc}.mini-table td{padding:9px 8px;border-bottom:1px solid #edf1f5;vertical-align:middle}.mini-table td:last-child{text-align:right}.totals{display:grid;gap:10px}.total-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}.total-row strong{font-variant-numeric:tabular-nums}.grand{padding-top:13px;border-top:1px solid #dce5eb;margin-top:5px;font-size:19px;font-weight:850}.quick-card{border-radius:12px;background:#172a42;color:#fff;padding:21px}.quick-card .smallprint{font-size:11px;color:#a9bdcf}.quick-card .count{font-size:27px;font-weight:800;margin:8px 0 2px}.inline-actions{display:flex;gap:6px;flex-wrap:wrap}.search{max-width:340px;width:100%}.flex-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.w85{width:85px!important}.w105{width:105px!important}.w120{width:120px!important}.split-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.bullets{margin:7px 0;padding-left:19px}.bullets li{margin:7px 0}.footer-note{text-align:center;color:#93a0af;font-size:11px;margin-top:35px}.modal-bg{position:fixed;z-index:200;inset:0;background:rgba(15,28,47,.64);padding:20px;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto}.modal{width:min(800px,100%);background:#fff;border-radius:15px;box-shadow:0 15px 70px #101b2e40;margin:25px 0;padding:24px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:20px}.invoice-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #112c42;padding-bottom:25px;margin-bottom:24px}.invoice-head h1{font-size:23px;margin-bottom:5px}.inv-meta{text-align:right}.invoice-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:23px}.invoice-note{font-size:11px;color:#7d8996;margin-top:35px;border-top:1px solid #ddd;padding-top:13px}.mobile-nav{display:none}.toast{position:fixed;z-index:300;bottom:25px;right:24px;border-radius:11px;background:#1b3e3b;color:#fff;box-shadow:0 10px 35px #0002;padding:12px 18px;font-weight:750;max-width:360px;font-size:13px}.toast.error{background:#963440}.pillbar{display:flex;gap:7px;flex-wrap:wrap}.pillbar button{border-radius:30px;padding:7px 12px;background:#f2f5f8;border:1px solid #e2e7ec;color:#5e6b7d;font-weight:750;font-size:12px}.pillbar button.sel{background:#e0f3ef;border-color:#a7dad0;color:#08756e}
@media(max-width:1080px){.grid-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.sidebar{width:206px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.field.span3{grid-column:span 2}}
@media(max-width:740px){.shell{display:block}.sidebar{display:none}.mobile-nav{display:flex;overflow-x:auto;background:#15263d;padding:8px 12px;gap:4px}.mobile-nav button{color:#e1eff6;background:transparent;border:0;padding:10px 11px;border-radius:9px;white-space:nowrap;font-weight:750}.mobile-nav button.active{background:#2f4b65}.topbar{padding:13px 17px}.content{padding:23px 14px}.page-title h1{font-size:23px}.grid-cards{gap:9px}.kpi{padding:15px}.kpi strong{font-size:25px}.fields{grid-template-columns:1fr}.field.span2,.field.span3{grid-column:span 1}.split-cards{grid-template-columns:1fr}.panel-head,.panel-body{padding:15px}.line-entry,.line-entry.parts{grid-template-columns:1fr 80px}.line-entry button{grid-column:span 2}.invoice-head{flex-direction:column}.inv-meta{text-align:left}}
@media print{body{background:#fff!important}body *{visibility:hidden!important}#printSheet,#printSheet *{visibility:visible!important}#printSheet{position:absolute!important;inset:0 auto auto 0!important;width:100%!important;margin:0!important;border:0!important;padding:12mm 15mm!important;box-shadow:none!important;border-radius:0!important}.modal-bg{position:static!important;display:block!important;background:none!important;padding:0!important;overflow:visible!important}.modal-actions{display:none!important}.invoice-note{color:#666!important}.table th{background:#eee!important} @page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="brandmark">⚙</div><div>GarageFlow<small>Management demo</small></div></div><nav class="nav" id="navDesktop"></nav><div class="sidebar-foot"><strong>Prototype v0.1</strong><br>Saved locally in this browser.<br>No online account or database.</div></aside>
<section class="main"><header class="topbar"><div><strong>Garage Management System</strong><small>Job cards · repair checklists · billing</small></div><div class="top-right"><span class="tag">● LOCAL PROTOTYPE</span><button class="btn small" onclick="downloadBackup()">↓ Backup</button></div></header><nav class="mobile-nav" id="navMobile"></nav><main class="content" id="view"></main></section>
</div><div id="modalHost"></div><div id="toastHost"></div><input id="backupFile" type="file" accept="application/json,.json" hidden onchange="restoreBackup(event)">
<script>
'use strict';
const STORAGE='garageflow-standalone-prototype-01';
const nowISO=()=>new Date().toISOString().slice(0,10);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const moneyN=(v)=>Math.max(0,Number(v)||0);
const money=(n)=>`${esc(data.company.currency)} ${moneyN(n).toLocaleString('en-US',{minimumFractionDigits:data.company.currency==='BHD'?3:2,maximumFractionDigits:data.company.currency==='BHD'?3:2})}`;
const shortDate=(iso)=>iso?new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const baseline=()=>({company:{name:'Your Garage Name',phone:'',address:'',vatNo:'',currency:'BHD',vatRate:0,invoicePrefix:'INV'},seq:{job:1001,invoice:1},jobs:[{id:'sample-job-1',jobNo:'JOB-1001',date:nowISO(),customer:'Sample Customer',phone:'',make:'BMW',model:'X3',plate:'DEMO-001',mileage:'',notes:'Demonstration job — edit or delete this sample.',status:'Open',completedAt:'',issues:[{id:'i1',text:'Check front brakes',done:true},{id:'i2',text:'Inspect suspension noise',done:false},{id:'i3',text:'Headlight bulb not working',done:false}],labor:[{id:'l1',desc:'Brake inspection and service',qty:1,unit:15}],parts:[{id:'p1',inventoryId:'inv-bulb',desc:'Headlight bulb',qty:1,unit:4.5}],invoiceNo:''}],items:[{id:'inv-bulb',name:'Headlight bulb',sku:'BLB-101',stock:18,price:4.5},{id:'inv-brake',name:'Brake pad set',sku:'BRK-201',stock:7,price:22},{id:'inv-filter',name:'Oil filter',sku:'FLT-102',stock:12,price:6}]});
let data;
try {const loaded=JSON.parse(localStorage.getItem(STORAGE));data=(loaded&&Array.isArray(loaded.jobs)&&Array.isArray(loaded.items)&&loaded.company&&loaded.seq)?loaded:baseline()}catch(e){data=baseline()}
const ui={page:'dashboard',jobId:null,jobQuery:'',jobFilter:'All',toastTimer:null};
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){toast('Cannot save. Browser storage may be blocked. Please export a backup.','error')}}
function toast(message,type='ok'){const host=document.getElementById('toastHost');host.innerHTML=`<div class="toast ${type==='error'?'error':''}">${esc(message)}</div>`;clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>host.innerHTML='',3300)}
const navEntries=[['dashboard','◫','Overview'],['jobs','▤','Job Cards'],['inventory','◧','Inventory'],['invoices','▣','Invoices'],['settings','⚙','Settings']];
function renderNav(){const make=mobile=>navEntries.map(([page,ico,label])=>`<button class="${ui.page===page||((ui.page==='job'||ui.page==='new')&&page==='jobs')?'active':''}" onclick="go('${page}')">${mobile?'':`<span class="ni">${ico}</span>`}${label}</button>`).join('');document.getElementById('navDesktop').innerHTML=make(false);document.getElementById('navMobile').innerHTML=make(true)}
function go(page,jobId){ui.page=page;ui.jobId=jobId??null;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){renderNav();const v=document.getElementById('view');v.innerHTML=({dashboard:renderDashboard,jobs:renderJobs,inventory:renderInventory,invoices:renderInvoices,settings:renderSettings,new:renderNewJob,job:renderJob}[ui.page]||renderDashboard)();}
function pageTitle(title,description,actions=''){return `<div class="page-title"><div><h1>${title}</h1><p>${description}</p></div><div class="btn-group">${actions}</div></div>`}
function issueProgress(j){const total=j.issues.length,done=j.issues.filter(x=>x.done).length;return {done,total,pct:total?Math.round(done/total*100):0}}
function pill(j){return `<span class="status ${j.status==='Completed'?'complete':'open'}">${j.status==='Completed'?'✓ Completed':'● In progress'}</span>`}
function progressBar(j){const a=issueProgress(j);return `<div class="progress"><i style="width:${a.pct}%"></i></div><span class="progress-label">${a.done} of ${a.total} checked</span>`}
function totals(j){let labor=j.labor.reduce((a,l)=>a+moneyN(l.qty)*moneyN(l.unit),0);let parts=j.parts.reduce((a,l)=>a+moneyN(l.qty)*moneyN(l.unit),0);let vat=(labor+parts)*moneyN(data.company.vatRate)/100;return {labor,parts,vat,total:labor+parts+vat}}
function renderTotals(j){const t=totals(j);return `<div class="totals"><div class="total-row"><span>Labour</span><strong>${money(t.labor)}</strong></div><div class="total-row"><span>Spare parts</span><strong>${money(t.parts)}</strong></div><div class="total-row"><span>VAT (${moneyN(data.company.vatRate)}%)</span><strong>${money(t.vat)}</strong></div><div class="total-row grand"><span>Total</span><strong>${money(t.total)}</strong></div></div>`}
function recentJobRows(jobs){return jobs.map(j=>`<tr><td><div class="name">${esc(j.jobNo)}</div><div class="sub">${shortDate(j.date)}</div></td><td><div class="name">${esc(j.customer)}</div><div class="sub">${esc(j.phone||'No phone entered')}</div></td><td><div class="name">${esc([j.make,j.model].filter(Boolean).join(' ')||'Vehicle')}</div><div class="sub">${esc(j.plate||'No plate')}</div></td><td>${progressBar(j)}</td><td>${pill(j)}</td><td><button class="btn small" onclick="go('job','${j.id}')">Open →</button></td></tr>`).join('')}
function renderDashboard(){const open=data.jobs.filter(j=>j.status!=='Completed'),completed=data.jobs.filter(j=>j.status==='Completed'),billed=data.jobs.filter(j=>j.invoiceNo),outstanding=data.jobs.reduce((a,j)=>a+j.issues.filter(i=>!i.done).length,0),total=billed.reduce((a,j)=>a+totals(j).total,0);return pageTitle('Garage overview','Track repair work from vehicle arrival to final invoice.',`<button class="btn primary" onclick="go('new')">＋ New job card</button>`)+`<div class="notice">This is a working demo. Changes are saved in this browser only. Start with the sample vehicle, or create your own job card. Use <strong>Backup</strong> to save a copy of your data.</div><div class="grid-cards"><div class="kpi"><span class="k-icon">🚗</span><small>Active jobs</small><strong>${open.length}</strong><div class="detail">Vehicles being worked on</div></div><div class="kpi"><span class="k-icon">☑</span><small>Completed jobs</small><strong>${completed.length}</strong><div class="detail">All issues verified</div></div><div class="kpi"><span class="k-icon">◷</span><small>Pending repair tasks</small><strong>${outstanding}</strong><div class="detail">Issues still needing checks</div></div><div class="kpi"><span class="k-icon">▣</span><small>Invoiced total</small><strong style="font-size:23px">${money(total)}</strong><div class="detail">Sum of issued invoices (demo)</div></div></div><section class="panel"><div class="panel-head"><div><h2>Recent job cards</h2><p>See what's open, what's done, and what is still pending.</p></div><button class="btn small" onclick="go('jobs')">View all jobs →</button></div>${data.jobs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Job</th><th>Customer</th><th>Vehicle</th><th>Checklist</th><th>Status</th><th></th></tr></thead><tbody>${recentJobRows([...data.jobs].reverse().slice(0,7))}</tbody></table></div>`:`<div class="empty"><strong>No job cards yet</strong>Create a job card to begin.</div>`}</section><div class="split-cards"><div class="quick-card"><div class="smallprint">HOW IT WORKS</div><div class="count">5 simple steps</div><div>Vehicle → Job card → Repair checklist → Final check → Invoice</div></div><div class="panel" style="margin:0"><div class="panel-body"><h3>Before using this for real work</h3><p class="muted">Confirm your invoice layout, VAT requirements, parts stock rules, and who can edit or close jobs.</p><button class="btn small" onclick="go('settings')">Configure garage details →</button></div></div></div><div class="footer-note">GarageFlow v0.1 — local proof-of-concept, not a production system</div>`}
function jobsFiltered(){return data.jobs.filter(j=>(ui.jobFilter==='All'||(ui.jobFilter==='Open'&&j.status!=='Completed')||(ui.jobFilter==='Completed'&&j.status==='Completed'))&&[j.jobNo,j.customer,j.phone,j.make,j.model,j.plate].join(' ').toLowerCase().includes(ui.jobQuery.toLowerCase()))}
function renderJobTable(){const rows=jobsFiltered();return rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Job number</th><th>Customer</th><th>Vehicle</th><th>Repair progress</th><th>Status</th><th></th></tr></thead><tbody>${recentJobRows([...rows].reverse())}</tbody></table></div>`:`<div class="empty"><strong>No matching job cards</strong>Try another search or create a new job.</div>`}
function renderJobs(){return pageTitle('Job cards','Every vehicle, customer complaint, and repair in one place.',`<button class="btn primary" onclick="go('new')">＋ New job card</button>`)+`<div class="panel"><div class="panel-head"><input aria-label="Search job cards" class="input search" placeholder="Search customer, vehicle or job number…" value="${esc(ui.jobQuery)}" oninput="filterJobSearch(this.value)"><div class="pillbar">${['All','Open','Completed'].map(s=>`<button class="${s===ui.jobFilter?'sel':''}" onclick="setJobFilter('${s}')">${s}</button>`).join('')}</div></div><div id="jobsTable">${renderJobTable()}</div></div>`}
function filterJobSearch(v){ui.jobQuery=v;document.getElementById('jobsTable').innerHTML=renderJobTable()}
function setJobFilter(f){ui.jobFilter=f;render()}
function field(label,name,type='text',required=false,place='',value='',span=''){return `<div class="field ${span}"><label class="label" for="new-${name}">${label}${required?' *':''}</label><input class="input" id="new-${name}" name="${name}" type="${type}" ${required?'required':''} placeholder="${esc(place)}" value="${esc(value)}"></div>`}
function renderNewJob(){return pageTitle('New job card','Record the vehicle and every issue reported by the customer.',`<button class="btn" onclick="go('jobs')">← Back</button>`)+`<form class="panel" id="createJobForm" onsubmit="createJob(event)"><div class="panel-head"><h2>Customer & vehicle details</h2></div><div class="panel-body"><div class="fields">${field('Customer name','customer','text',true,'e.g. Ahmed Ali')}${field('Phone','phone','tel',false,'Phone number')}${field('Date received','date','date',true,'',nowISO())}${field('Vehicle make','make','text',true,'e.g. Tata')}${field('Vehicle model','model','text',false,'e.g. Nexon')}${field('Plate number','plate','text',false,'e.g. 123456')}${field('Mileage / odometer','mileage','text',false,'e.g. 85,000 km','', 'span2')}</div></div><div class="panel-head"><h2>Reported problems</h2></div><div class="panel-body"><label class="label" for="new-issues">Enter one complaint or repair request per line *</label><textarea id="new-issues" name="issues" required class="textarea" placeholder="Brakes making noise&#10;Suspension needs checking&#10;Headlight bulb not working"></textarea><div class="helper">Each line becomes a separate checklist item.</div><div style="height:18px"></div><label class="label" for="new-notes">Additional notes (optional)</label><textarea name="notes" id="new-notes" class="textarea" placeholder="Any instructions or information about the vehicle..."></textarea><div style="margin-top:22px" class="btn-group"><button class="btn primary" type="submit">✓ Create job card</button><button type="button" class="btn" onclick="go('jobs')">Cancel</button></div></div></form>`}
function createJob(ev){ev.preventDefault();const f=new FormData(ev.target);const issues=String(f.get('issues')||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!issues.length){toast('Enter at least one reported problem.','error');return}data.seq.job++;const j={id:id(),jobNo:'JOB-'+String(data.seq.job),date:String(f.get('date')||nowISO()),customer:String(f.get('customer')||'').trim(),phone:String(f.get('phone')||'').trim(),make:String(f.get('make')||'').trim(),model:String(f.get('model')||'').trim(),plate:String(f.get('plate')||'').trim(),mileage:String(f.get('mileage')||'').trim(),notes:String(f.get('notes')||'').trim(),status:'Open',completedAt:'',issues:issues.map(t=>({id:id(),text:t,done:false})),labor:[],parts:[],invoiceNo:''};data.jobs.push(j);persist();go('job',j.id);toast('Job card created')}
function getJob(jid=ui.jobId){return data.jobs.find(j=>j.id===jid)}
function renderJob(){const j=getJob();if(!j)return pageTitle('Job not found','This job may have been deleted.',`<button class="btn" onclick="go('jobs')">Back</button>`);const p=issueProgress(j);return pageTitle(`${esc(j.jobNo)} · ${esc(j.customer)}`,`${esc([j.make,j.model,j.plate].filter(Boolean).join(' · '))}  •  Received ${shortDate(j.date)}`,`<button class="btn" onclick="go('jobs')">← All jobs</button><button class="btn dark" onclick="openInvoice('${j.id}')">▣ ${j.invoiceNo?'View invoice':'Create invoice'}</button>`)+`<div class="cols"><div><section class="panel"><div class="panel-head"><div><h2>Customer & vehicle</h2><p>Changes to these fields save automatically when you finish editing them.</p></div>${pill(j)}</div><div class="panel-body"><div class="fields">${editField(j,'Customer name','customer')}${editField(j,'Phone','phone')}${editField(j,'Date received','date','date')}${editField(j,'Make','make')}${editField(j,'Model','model')}${editField(j,'Plate number','plate')}${editField(j,'Mileage','mileage')}${editField(j,'Workshop notes','notes','textarea','span2')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Repair checklist</h2><p>Mark each reported issue only after the work is checked.</p></div><span class="status ${p.done===p.total&&p.total?'complete':'open'}">${p.done} / ${p.total} done</span></div><div class="panel-body">${j.issues.map(issue=>`<div class="issue"><input type="checkbox" aria-label="Mark ${esc(issue.text)} as complete" ${issue.done?'checked':''} onchange="toggleIssue('${j.id}','${issue.id}',this.checked)"><div class="issue-text ${issue.done?'done':''}">${esc(issue.text)}</div><button class="btn ghost small danger" title="Delete checklist item" onclick="removeIssue('${j.id}','${issue.id}')">✕</button></div>`).join('')}<div class="issue-input"><input class="input" id="newIssue" placeholder="Add another repair or complaint…" onkeydown="if(event.key==='Enter'){event.preventDefault();addIssue('${j.id}')}"/><button class="btn" onclick="addIssue('${j.id}')">＋ Add</button></div><div class="helper">You cannot mark a job as completed while any checklist item is pending.</div></div></section><section class="panel"><div class="panel-head"><div><h2>Labour charges</h2><p>Add or change labour charges for each vehicle.</p></div></div><div class="panel-body"><div class="line-entry"><input class="input" id="laborDesc" placeholder="Work description" aria-label="Labour description"><input class="input" type="number" step="1" min="1" id="laborQty" value="1" aria-label="Labour quantity"><input class="input" type="number" min="0" step="0.001" id="laborPrice" placeholder="Price" aria-label="Labour unit price"><button class="btn" onclick="addLabor('${j.id}')">＋ Add</button></div>${renderLines(j,'labor')}</div></section><section class="panel"><div class="panel-head"><div><h2>Spare parts & inventory</h2><p>Select an item from inventory or add a custom part. The unit price is editable.</p></div></div><div class="panel-body"><div class="line-entry parts"><select class="select" id="partSelect" aria-label="Inventory part"><option value="">Select a part from inventory</option>${data.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)} — ${money(i.price)} (stock: ${i.stock})</option>`).join('')}</select><input type="number" id="partQty" aria-label="Parts quantity" class="input" min="1" value="1" step="1"><button class="btn" onclick="addPart('${j.id}')">＋ Add part</button></div><div class="line-entry"><input class="input" id="customPartDesc" placeholder="Or enter a custom part" aria-label="Custom part description"><input class="input" id="customPartQty" type="number" min="1" step="1" value="1" aria-label="Custom part quantity"><input class="input" id="customPartPrice" type="number" min="0" step="0.001" placeholder="Price" aria-label="Custom part price"><button class="btn" onclick="addCustomPart('${j.id}')">＋ Add</button></div>${renderLines(j,'parts')}<div class="helper">Inventory stock is not automatically deducted in this prototype.</div></div></section></div><div><section class="panel"><div class="panel-head"><h2>Repair completion</h2></div><div class="panel-body"><div class="quick-card"><div class="smallprint">REPAIR CHECKLIST</div><div class="count">${p.done} of ${p.total}</div><div style="background:#395469;height:7px;border-radius:6px;overflow:hidden"><div style="width:${p.pct}%;background:#5ee0bb;height:7px"></div></div><div style="font-size:12px;margin-top:10px;color:#cbd8e4">${p.total-p.done} pending ${p.total-p.done===1?'item':'items'}</div></div><div style="height:15px"></div>${j.status==='Completed'?`<div class="notice">This job was completed${j.completedAt?' on '+shortDate(j.completedAt):''}.</div><button class="btn" style="width:100%" onclick="reopenJob('${j.id}')">↶ Reopen job</button>`:`${p.done===p.total&&p.total?`<div class="notice">All repair items have been checked. You can now close the job.</div>`:`<div class="notice warn">Complete all checklist items before closing this job.</div>`}<button class="btn primary" style="width:100%" ${p.done===p.total&&p.total?'':'disabled title="Pending repair items"'} onclick="completeJob('${j.id}')">✓ Mark job completed</button>`}</div></section><section class="panel"><div class="panel-head"><h2>Bill summary</h2></div><div class="panel-body"><div id="billTotals">${renderTotals(j)}</div><div style="height:21px"></div><button class="btn primary" style="width:100%" onclick="openInvoice('${j.id}')">▣ ${j.invoiceNo?'View / print invoice':'Generate invoice'}</button><div class="helper">Company details, currency, and tax rate can be changed in Settings.</div></div></section><div class="panel"><div class="panel-body"><h3 style="margin-bottom:8px">Job card actions</h3><div class="btn-group"><button class="btn small" onclick="printJobCard('${j.id}')">⎙ Print job card</button><button class="btn danger small" onclick="deleteJob('${j.id}')">Delete job</button></div></div></div></div></div>`}
function editField(j,label,name,type='text',span=''){return `<div class="field ${span}"><label class="label">${label}</label>${type==='textarea'?`<textarea class="textarea" onchange="editJob('${j.id}','${name}',this.value)">${esc(j[name]||'')}</textarea>`:`<input class="input" value="${esc(j[name]||'')}" type="${type}" onchange="editJob('${j.id}','${name}',this.value)"/>`}</div>`}
function editJob(jid,key,v){const j=getJob(jid);if(!j||!['customer','phone','date','make','model','plate','mileage','notes'].includes(key))return;j[key]=v.trim();persist();toast('Changes saved')}
function toggleIssue(jid,issueId,checked){const j=getJob(jid);if(!j)return;const issue=j.issues.find(x=>x.id===issueId);if(!issue)return;issue.done=checked;if(!checked&&j.status==='Completed'){j.status='Open';j.completedAt=''}persist();render()}
function addIssue(jid){const input=document.getElementById('newIssue');const v=input?.value.trim();if(!v){toast('Enter the repair or complaint first.','error');return}const j=getJob(jid);j.issues.push({id:id(),text:v,done:false});if(j.status==='Completed'){j.status='Open';j.completedAt=''}persist();render();document.getElementById('newIssue')?.focus();toast('Checklist item added')}
function removeIssue(jid,issueId){if(!confirm('Remove this repair checklist item?'))return;const j=getJob(jid);j.issues=j.issues.filter(x=>x.id!==issueId);if(j.status==='Completed')reopenJobNoRender(j);persist();render()}
function reopenJobNoRender(j){j.status='Open';j.completedAt=''}
function reopenJob(jid){const j=getJob(jid);if(!j)return;reopenJobNoRender(j);persist();render();toast('Job reopened')}
function completeJob(jid){const j=getJob(jid);if(!j)return;if(!j.issues.length||j.issues.some(i=>!i.done)){toast('Finish every checklist item first.','error');return}j.status='Completed';j.completedAt=nowISO();persist();render();toast('Job marked completed')}
function deleteJob(jid){const j=getJob(jid);if(!j)return;if(!confirm(`Delete ${j.jobNo}? This will also delete any invoice for this job. Export a backup first if needed.`))return;data.jobs=data.jobs.filter(x=>x.id!==jid);persist();go('jobs');toast('Job deleted')}
function renderLines(j,type){const ls=j[type];if(!ls.length)return `<div class="muted" style="font-size:12px">No ${type==='labor'?'labour':'spare part'} charges added yet.</div>`;return `<div class="tablewrap"><table class="mini-table"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th><th></th></tr></thead><tbody>${ls.map(l=>`<tr><td><input class="lineinput" style="min-width:155px;width:100%;max-width:280px" aria-label="Description" value="${esc(l.desc)}" onchange="editLine('${j.id}','${type}','${l.id}','desc',this.value)"></td><td><input class="lineinput w85" aria-label="Quantity" type="number" min="1" step="1" value="${moneyN(l.qty)}" onchange="editLine('${j.id}','${type}','${l.id}','qty',this.value)"></td><td><input class="lineinput w105" aria-label="Price" type="number" min="0" step="0.001" value="${moneyN(l.unit)}" onchange="editLine('${j.id}','${type}','${l.id}','unit',this.value)"></td><td style="white-space:nowrap">${money(moneyN(l.qty)*moneyN(l.unit))}</td><td><button class="btn ghost danger small" onclick="removeLine('${j.id}','${type}','${l.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>`}
function addLabor(jid){const desc=document.getElementById('laborDesc').value.trim(),qty=Number(document.getElementById('laborQty').value),unit=Number(document.getElementById('laborPrice').value);if(!desc||!Number.isInteger(qty)||qty<=0||!Number.isFinite(unit)||unit<0||document.getElementById('laborPrice').value===''){toast('Enter a description, valid quantity, and labour price.','error');return}getJob(jid).labor.push({id:id(),desc,qty,unit});persist();render();toast('Labour charge added')}
function addPart(jid){const partId=document.getElementById('partSelect').value,qty=Number(document.getElementById('partQty').value);const item=data.items.find(i=>i.id===partId);if(!item||!Number.isInteger(qty)||qty<=0){toast('Select a part and a valid quantity.','error');return}getJob(jid).parts.push({id:id(),inventoryId:item.id,desc:item.name,qty,unit:moneyN(item.price)});persist();render();toast('Part added to bill')}
function addCustomPart(jid){const desc=document.getElementById('customPartDesc').value.trim(),qty=Number(document.getElementById('customPartQty').value),unit=Number(document.getElementById('customPartPrice').value);if(!desc||!Number.isInteger(qty)||qty<=0||!Number.isFinite(unit)||unit<0||document.getElementById('customPartPrice').value===''){toast('Enter the part, quantity and price.','error');return}getJob(jid).parts.push({id:id(),inventoryId:'',desc,qty,unit});persist();render();toast('Custom part added')}
function editLine(jid,type,lineid,key,value){const j=getJob(jid);if(!j||!['labor','parts'].includes(type))return;const line=j[type].find(l=>l.id===lineid);if(!line)return;if(key==='desc'){if(!value.trim()){toast('Description cannot be empty.','error');render();return}line.desc=value.trim()}else if(key==='qty'){if(!Number.isInteger(Number(value))||Number(value)<1){toast('Quantity must be a whole number of at least 1.','error');render();return}line.qty=Number(value)}else if(key==='unit'){if(value===''||!Number.isFinite(Number(value))||Number(value)<0){toast('Enter a valid price.','error');render();return}line.unit=Number(value)}else return;persist();render();toast('Bill updated')}
function removeLine(jid,type,lineid){const j=getJob(jid);if(!j||!['labor','parts'].includes(type))return;j[type]=j[type].filter(x=>x.id!==lineid);persist();render();toast('Bill line removed')}
function renderInventory(){return pageTitle('Parts inventory','Keep a simple list of spare parts that can be selected when billing.',`<button class="btn" onclick="go('jobs')">View job cards →</button>`)+`<div class="notice warn">Stock counts are for reference only. Adding an item to a bill does not reduce stock in this prototype.</div><form class="panel" onsubmit="addInventory(event)"><div class="panel-head"><h2>Add inventory item</h2></div><div class="panel-body"><div class="fields">${field('Part name','itemName','text',true,'e.g. Brake pad set')}${field('SKU / part code','itemSku','text',false,'e.g. BRK-221')}${field('Stock quantity','itemStock','number',true,'','0')}${field('Default selling price','itemPrice','number',true,'','0')}</div><div style="margin-top:17px"><button class="btn primary" type="submit">＋ Add to inventory</button></div></div></form><div class="panel"><div class="panel-head"><div><h2>Available spare parts</h2><p>Update item details directly in the table below.</p></div><span class="tag">${data.items.length} items</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Part name</th><th>Part code</th><th>Quantity in stock</th><th>Default price</th><th></th></tr></thead><tbody>${data.items.map(i=>`<tr><td><input class="input" style="min-width:170px" aria-label="Part name" value="${esc(i.name)}" onchange="editInventory('${i.id}','name',this.value)"></td><td><input class="input" style="min-width:110px" aria-label="Part code" value="${esc(i.sku)}" onchange="editInventory('${i.id}','sku',this.value)"></td><td><input class="input w105" type="number" min="0" step="1" aria-label="Stock" value="${i.stock}" onchange="editInventory('${i.id}','stock',this.value)"></td><td><input class="input w120" type="number" min="0" step="0.001" aria-label="Default price" value="${moneyN(i.price)}" onchange="editInventory('${i.id}','price',this.value)"></td><td><button class="btn danger small" onclick="removeInventory('${i.id}')">Remove</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addInventory(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('itemName')||'').trim(),sku=String(f.get('itemSku')||'').trim(),stock=Number(f.get('itemStock')),price=Number(f.get('itemPrice'));if(!name||!Number.isInteger(stock)||stock<0||!Number.isFinite(price)||price<0){toast('Enter a part name, non-negative stock and price.','error');return}data.items.push({id:id(),name,sku,stock,price});persist();render();toast('Inventory item added')}
function editInventory(itemId,key,value){const i=data.items.find(x=>x.id===itemId);if(!i)return;if(key==='name'||key==='sku'){if(key==='name'&&!value.trim()){toast('Part name cannot be empty.','error');render();return}i[key]=value.trim()}else if(key==='stock'){if(!Number.isInteger(Number(value))||Number(value)<0){toast('Stock must be a non-negative whole number.','error');render();return}i.stock=Number(value)}else if(key==='price'){if(value===''||!Number.isFinite(Number(value))||Number(value)<0){toast('Enter a valid non-negative price.','error');render();return}i.price=Number(value)}else return;persist();toast('Inventory updated')}
function removeInventory(itemId){if(!confirm('Remove this inventory item? Existing invoices and job bills will keep their saved part lines.'))return;data.items=data.items.filter(i=>i.id!==itemId);persist();render();toast('Inventory item removed')}
function renderInvoices(){const issued=data.jobs.filter(j=>j.invoiceNo);const amount=issued.reduce((a,j)=>a+totals(j).total,0);return pageTitle('Invoices','Invoices generated from the charges saved on each job card.',`<button class="btn" onclick="go('jobs')">＋ Bill a job</button>`)+`<div class="grid-cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><small>Invoices created</small><strong>${issued.length}</strong></div><div class="kpi"><small>Total invoiced amount</small><strong style="font-size:25px">${money(amount)}</strong></div></div><div class="panel">${issued.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Invoice</th><th>Job</th><th>Customer / vehicle</th><th>Invoice total</th><th></th></tr></thead><tbody>${[...issued].reverse().map(j=>`<tr><td class="name">${esc(j.invoiceNo)}</td><td>${esc(j.jobNo)}<div class="sub">${shortDate(j.date)}</div></td><td><span class="name">${esc(j.customer)}</span><div class="sub">${esc([j.make,j.model,j.plate].filter(Boolean).join(' · '))}</div></td><td><strong>${money(totals(j).total)}</strong></td><td class="inline-actions"><button class="btn small" onclick="openInvoice('${j.id}')">View / print</button><button class="btn small" onclick="go('job','${j.id}')">Edit job</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No invoices yet</strong>Open a job card, add labour or parts, then generate an invoice.</div>`}</div><div class="notice warn">Invoices in this prototype use live job-card prices. Editing an invoiced job changes its displayed invoice total. Production software should lock issued invoices and handle revisions separately.</div>`}
function renderSettings(){const c=data.company;return pageTitle('Garage settings','Set your garage name and invoice options before creating real bills.',`<button class="btn" onclick="downloadBackup()">↓ Export backup</button>`)+`<form class="panel" onsubmit="saveSettings(event)"><div class="panel-head"><h2>Garage / company details</h2></div><div class="panel-body"><div class="fields">${setting('Garage name','name',c.name,true)}${setting('Contact number','phone',c.phone)}${setting('Address','address',c.address,false,'span2')}${setting('VAT registration number','vatNo',c.vatNo)}<div class="field"><label class="label">Currency</label><select class="select" name="currency">${['BHD','USD','INR','AED','SAR','EUR','GBP'].map(x=>`<option ${c.currency===x?'selected':''}>${x}</option>`).join('')}</select></div>${setting('VAT rate (%)','vatRate',c.vatRate,true,'','number')}${setting('Invoice prefix','invoicePrefix',c.invoicePrefix,true)}</div><p class="helper">VAT defaults to 0% until you confirm the applicable rate with the garage. Invoice numbers use the prefix above and automatic numbering.</p><div style="margin-top:19px"><button class="btn primary" type="submit">✓ Save settings</button></div></div></form><section class="panel"><div class="panel-head"><h2>Backup & data management</h2></div><div class="panel-body"><p class="muted">Your records are saved in this browser, not on a server. Download a backup regularly to avoid losing records if browser data is cleared.</p><div class="btn-group"><button class="btn" onclick="downloadBackup()">↓ Download JSON backup</button><button class="btn" onclick="document.getElementById('backupFile').click()">↑ Restore from JSON backup</button><button class="btn danger" onclick="resetData()">Reset to sample data</button></div></div></section><div class="notice warn"><strong>Prototype limitations:</strong> No user logins, cloud access, multi-device sync, automatic stock deduction, formal tax compliance, payment processing, or immutable issued invoices. These need approval and development before production.</div>`}
function setting(label,name,value,required=false,span='',type='text'){return `<div class="field ${span}"><label class="label">${label}</label><input class="input" name="${name}" type="${type}" ${type==='number'?'min="0" max="100" step="0.01"':''} ${required?'required':''} value="${esc(value)}"></div>`}
function saveSettings(ev){ev.preventDefault();const f=new FormData(ev.target),vat=Number(f.get('vatRate'));if(!Number.isFinite(vat)||vat<0||vat>100){toast('VAT must be between 0 and 100.','error');return}data.company={name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),address:String(f.get('address')||'').trim(),vatNo:String(f.get('vatNo')||'').trim(),currency:String(f.get('currency')||'BHD'),vatRate:vat,invoicePrefix:String(f.get('invoicePrefix')||'INV').trim().toUpperCase().replace(/[^A-Z0-9-_]/g,'')||'INV'};persist();render();toast('Garage settings saved')}
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'GarageFlow',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`garageflow-backup-${nowISO()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Backup downloaded')}
async function restoreBackup(ev){const file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{const backup=JSON.parse(await file.text()),d=backup.data||backup;if(!d.company||!d.seq||!Array.isArray(d.jobs)||!Array.isArray(d.items)||d.jobs.some(j=>!Array.isArray(j.issues)||!Array.isArray(j.labor)||!Array.isArray(j.parts)))throw Error('Invalid backup format');if(!confirm('Restore this backup? It will replace all current browser data.'))return;data=d;persist();go('dashboard');toast('Backup restored')}catch(e){toast('This file is not a valid GarageFlow backup.','error')}}
function resetData(){if(!confirm('Reset this demo? Current browser data will be erased. Export a backup first if needed.'))return;data=baseline();persist();go('dashboard');toast('Restored original sample data')}
function ensureInvoiceNumber(j){if(j.invoiceNo)return;const seq=data.seq.invoice++;j.invoiceNo=`${data.company.invoicePrefix}-${String(seq).padStart(4,'0')}`;persist()}
function openInvoice(jid){const j=getJob(jid);if(!j)return;const firstTime=!j.invoiceNo;if(firstTime){if(!confirm(`Generate an invoice for ${j.jobNo}? An invoice number will be assigned.`))return;ensureInvoiceNumber(j)}const c=data.company,t=totals(j);document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="printSheet"><div class="modal-actions"><button class="btn small" onclick="closeModal()">✕ Close</button><button class="btn small primary" onclick="window.print()">⎙ Print / Save as PDF</button></div><div class="invoice-head"><div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.address).replace(/\n/g,'<br>')}</div><div>${esc(c.phone)}</div>${c.vatNo?`<div>VAT Reg: ${esc(c.vatNo)}</div>`:''}</div><div class="inv-meta"><div style="letter-spacing:2px;font-size:12px;color:#68798e;font-weight:750">INVOICE</div><h2 style="font-size:26px;margin:3px 0">${esc(j.invoiceNo)}</h2><div>Date: ${shortDate(nowISO())}</div><div>Job: ${esc(j.jobNo)}</div></div></div><div class="invoice-meta-grid"><div><div class="label">BILL TO</div><div class="name">${esc(j.customer)}</div><div>${esc(j.phone)}</div></div><div><div class="label">VEHICLE</div><div><strong>${esc([j.make,j.model].filter(Boolean).join(' '))}</strong></div><div>Plate: ${esc(j.plate||'—')}</div><div>Mileage: ${esc(j.mileage||'—')}</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Item / service</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit price</th><th style="text-align:right">Amount</th></tr></thead><tbody>${[...j.labor.map(l=>({...l,desc:`Labour: ${l.desc}`})),...j.parts].map(l=>`<tr><td>${esc(l.desc)}</td><td style="text-align:right">${moneyN(l.qty)}</td><td style="text-align:right">${money(l.unit)}</td><td style="text-align:right">${money(moneyN(l.qty)*moneyN(l.unit))}</td></tr>`).join('')||`<tr><td colspan="4" class="muted">No charges added yet.</td></tr>`}</tbody></table></div><div style="display:flex;justify-content:flex-end;margin:30px 0"><div style="width:min(320px,100%)">${renderTotals(j)}</div></div><div class="invoice-note">Generated with GarageFlow prototype • Verify company invoice format, applicable VAT, and legal requirements before customer use.</div></div></div>`;if(firstTime)toast('Invoice number generated')}
function printJobCard(jid){const j=getJob(jid);if(!j)return;const p=issueProgress(j);document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="printSheet"><div class="modal-actions"><button class="btn small" onclick="closeModal()">✕ Close</button><button class="btn small primary" onclick="window.print()">⎙ Print / Save as PDF</button></div><div class="invoice-head"><div><h1>${esc(data.company.name)}</h1><div class="muted">WORKSHOP JOB CARD</div></div><div class="inv-meta"><h2>${esc(j.jobNo)}</h2><div>${shortDate(j.date)}</div></div></div><div class="invoice-meta-grid"><div><div class="label">CUSTOMER</div><strong>${esc(j.customer)}</strong><div>${esc(j.phone||'')}</div></div><div><div class="label">VEHICLE</div><strong>${esc([j.make,j.model].filter(Boolean).join(' '))}</strong><div>Plate: ${esc(j.plate||'—')}</div><div>Mileage: ${esc(j.mileage||'—')}</div></div></div><h3>Reported issues & repair status</h3><table class="table"><thead><tr><th style="width:70%">Complaint / repair</th><th>Status</th></tr></thead><tbody>${j.issues.map(i=>`<tr><td>${esc(i.text)}</td><td>${i.done?'✓ Completed':'☐ Pending'}</td></tr>`).join('')}</tbody></table><p style="margin-top:20px"><strong>Overall status:</strong> ${esc(j.status)} (${p.done}/${p.total} checked)</p><p><strong>Notes:</strong> ${esc(j.notes||'—')}</p><div class="invoice-note">Technician: ____________________ &nbsp;&nbsp; Date: ____________________</div></div></div>`}
function closeModal(){document.getElementById('modalHost').innerHTML=''}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
persist();render();
</script>
</body>
